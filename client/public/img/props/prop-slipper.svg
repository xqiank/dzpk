<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff2e63"/>
    </linearGradient>
    <filter id="slipperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Slipper Sole -->
  <path d="M22 10 C32 9 44 14 44 26 C44 34 38 41 40 48 C41 54 36 58 28 58 C20 58 16 52 18 45 C19 38 14 31 14 23 C14 13 18 10 22 10 Z" 
        fill="url(#soleGrad)" filter="url(#slipperShadow)" transform="rotate(-15 30 34)"/>
  <!-- Sole Inner Pattern -->
  <ellipse cx="30" cy="34" rx="10" ry="19" fill="#005bb5" opacity="0.2" transform="rotate(-15 30 34)"/>
  <!-- Straps -->
  <path d="M26 24 C23 29 19 36 21 41" fill="none" stroke="url(#strapGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M26 24 C31 28 37 34 36 39" fill="none" stroke="url(#strapGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Toe Post Plug -->
  <circle cx="26" cy="24" r="3.5" fill="#ffd166"/>
</svg>
