<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="roseRed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="70%" stop-color="#d91b42"/>
      <stop offset="100%" stop-color="#800a20"/>
    </radialGradient>
    <radialGradient id="rosePink" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="70%" stop-color="#e83e8c"/>
      <stop offset="100%" stop-color="#91144f"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55d862"/>
      <stop offset="100%" stop-color="#1d7828"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e08e00"/>
    </linearGradient>
    <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Wrapper / Stems -->
  <path d="M26 38 L32 58 L38 38 Z" fill="#99d98c" stroke="#52b788" stroke-width="1.5"/>
  <ellipse cx="32" cy="58" rx="3" ry="2" fill="#52b788"/>
  <!-- Leaves -->
  <path d="M14 26 C12 18 20 18 25 24 C20 28 15 28 14 26 Z" fill="url(#leafGrad)"/>
  <path d="M50 26 C52 18 44 18 39 24 C44 28 49 28 50 26 Z" fill="url(#leafGrad)"/>
  <!-- Side Roses -->
  <circle cx="21" cy="27" r="11" fill="url(#rosePink)" filter="url(#flowerShadow)"/>
  <path d="M17 25 C17 21 25 21 25 27 C25 31 19 31 19 28" fill="none" stroke="#ffe3ec" stroke-width="2" stroke-linecap="round"/>
  
  <circle cx="43" cy="27" r="11" fill="url(#rosePink)" filter="url(#flowerShadow)"/>
  <path d="M39 25 C39 21 47 21 47 27 C47 31 41 31 41 28" fill="none" stroke="#ffe3ec" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Center Main Rose -->
  <circle cx="32" cy="18" r="13" fill="url(#roseRed)" filter="url(#flowerShadow)"/>
  <path d="M28 16 C28 11 36 11 36 17 C36 21 29 22 29 18" fill="none" stroke="#ffb3c1" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Golden Ribbon Bow -->
  <path d="M32 40 C28 35 22 36 25 43 C28 47 32 43 32 40 Z" fill="url(#ribbonGrad)"/>
  <path d="M32 40 C36 35 42 36 39 43 C36 47 32 43 32 40 Z" fill="url(#ribbonGrad)"/>
  <circle cx="32" cy="41" r="3" fill="#ffea79"/>
  <path d="M30 43 L26 53 M34 43 L38 53" stroke="url(#ribbonGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
