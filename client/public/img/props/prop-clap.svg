<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="clapGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="clapGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </linearGradient>
    <filter id="clapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Left Hand -->
  <g transform="translate(10, 16) rotate(-22)" filter="url(#clapShadow)">
    <rect x="0" y="16" width="22" height="14" rx="6" fill="url(#clapGrad1)"/>
    <rect x="4" y="0" width="7" height="18" rx="3.5" fill="url(#clapGrad1)"/>
    <rect x="12" y="3" width="7" height="16" rx="3.5" fill="url(#clapGrad1)"/>
    <rect x="20" y="7" width="6" height="14" rx="3" fill="url(#clapGrad1)"/>
    <path d="M-2 18 C0 10 5 10 7 14" stroke="#ff8f00" stroke-width="2" fill="none"/>
  </g>
  <!-- Right Hand -->
  <g transform="translate(32, 8) rotate(24)" filter="url(#clapShadow)">
    <rect x="2" y="16" width="22" height="14" rx="6" fill="url(#clapGrad2)"/>
    <rect x="12" y="0" width="7" height="18" rx="3.5" fill="url(#clapGrad2)"/>
    <rect x="5" y="3" width="7" height="16" rx="3.5" fill="url(#clapGrad2)"/>
    <rect x="-2" y="7" width="6" height="14" rx="3" fill="url(#clapGrad2)"/>
  </g>
  <!-- Action sparks -->
  <path d="M30 4 L34 10 M34 4 L30 10" stroke="#ffeb3b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="8" r="1.5" fill="#ffeb3b"/>
  <circle cx="42" cy="8" r="1.5" fill="#ffeb3b"/>
</svg>
