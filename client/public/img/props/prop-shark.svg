<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sharkBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="60%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="sharkBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <filter id="sharkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Dorsal Fin -->
  <path d="M28 24 C32 14 36 10 40 14 C38 20 37 24 37 26 Z" fill="url(#sharkBody)" filter="url(#sharkShadow)"/>
  <!-- Tail Fins -->
  <path d="M12 28 C8 18 4 16 6 24 C8 28 8 32 6 36 C4 44 8 42 12 32 Z" fill="url(#sharkBody)" filter="url(#sharkShadow)"/>
  <!-- Main Torso -->
  <path d="M10 30 C16 24 32 20 54 26 C58 28 60 34 56 38 C48 44 32 44 16 34 Z" fill="url(#sharkBody)" filter="url(#sharkShadow)"/>
  <!-- White Belly -->
  <path d="M22 35 C32 37 45 37 54 36 C52 40 40 43 28 41 C22 39 18 36 22 35 Z" fill="url(#sharkBelly)"/>
  <!-- Pectoral Fin -->
  <path d="M34 36 C38 46 44 48 42 42 C40 38 38 36 38 36 Z" fill="#1565c0"/>
  <!-- Gills -->
  <path d="M40 28 C40 32 41 33 41 33 M37 28 C37 32 38 33 38 33" stroke="#0d47a1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Fierce Eye -->
  <circle cx="50" cy="28" r="3" fill="#ffffff"/>
  <circle cx="51" cy="28" r="1.8" fill="#111111"/>
  <circle cx="51.5" cy="27.5" r="0.6" fill="#ffffff"/>
  <!-- Open Mouth with Sharp Teeth -->
  <path d="M46 34 C50 34 54 33 56 37 C51 38 48 37 46 34 Z" fill="#b71c1c"/>
  <polygon points="48,34 49,36 50,34 51,36 52,34 53,36 54,34" fill="#ffffff"/>
</svg>
