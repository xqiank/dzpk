<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="beerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc837"/>
      <stop offset="100%" stop-color="#ff8008"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0e0"/>
    </linearGradient>
    <filter id="beerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Mug Handle -->
  <path d="M42 22 H49 C55 22 57 26 57 32 C57 38 55 42 49 42 H42" fill="none" stroke="#e0e8f0" stroke-width="6" stroke-linecap="round"/>
  <path d="M42 22 H49 C55 22 57 26 57 32 C57 38 55 42 49 42 H42" fill="none" stroke="#b0c4de" stroke-width="2" stroke-linecap="round"/>
  <!-- Mug Glass Body -->
  <rect x="14" y="20" width="30" height="34" rx="5" fill="url(#beerGrad)" filter="url(#beerShadow)"/>
  <!-- Glass Ribs / Highlights -->
  <line x1="20" y1="23" x2="20" y2="49" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="28" y1="23" x2="28" y2="49" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  <line x1="36" y1="23" x2="36" y2="49" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Foam Cap -->
  <path d="M12 21 C12 16 16 12 21 13 C23 9 29 8 33 11 C37 8 43 10 44 14 C47 14 49 17 48 21 C45 23 15 23 12 21 Z" fill="url(#foamGrad)" filter="url(#beerShadow)"/>
  <!-- Foam Drips -->
  <ellipse cx="17" cy="24" rx="3" ry="5" fill="#ffffff"/>
  <ellipse cx="38" cy="25" rx="2.5" ry="4" fill="#ffffff"/>
  <circle cx="28" cy="18" r="1.5" fill="#f0f0e0"/>
  <circle cx="34" cy="16" r="1.2" fill="#f0f0e0"/>
</svg>
