<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="40%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="cuffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <filter id="thumbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Sleeve / Cuff -->
  <rect x="8" y="38" width="14" height="18" rx="3" fill="url(#cuffGrad)" filter="url(#thumbShadow)"/>
  <rect x="8" y="38" width="4" height="18" rx="2" fill="#90a4ae"/>
  <!-- Fist Body -->
  <rect x="20" y="30" width="28" height="24" rx="8" fill="url(#thumbGrad)" filter="url(#thumbShadow)"/>
  <!-- Fingers Knuckles -->
  <rect x="42" y="31" width="13" height="6" rx="3" fill="#ffa726"/>
  <rect x="44" y="38" width="12" height="6" rx="3" fill="#fb8c00"/>
  <rect x="42" y="45" width="11" height="6" rx="3" fill="#f57c00"/>
  <!-- Thumb Up -->
  <path d="M22 36 C22 28 26 12 32 10 C36 8 40 12 39 18 C38 24 36 26 36 30 Z" fill="url(#thumbGrad)" filter="url(#thumbShadow)"/>
  <!-- Highlight on thumb -->
  <path d="M30 14 C32 12 35 14 35 18 C35 22 34 25 32 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
