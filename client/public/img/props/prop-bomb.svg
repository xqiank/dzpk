<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bombBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="90%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffea00"/>
      <stop offset="80%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="bombShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Fuse -->
  <path d="M40 22 C43 17 48 16 50 11" fill="none" stroke="#d4a373" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spark on fuse -->
  <circle cx="51" cy="10" r="7" fill="url(#sparkGrad)"/>
  <path d="M51 6 L51 14 M47 10 L55 10 M48 7 L54 13 M48 13 L54 7" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cap Collar -->
  <rect x="34" y="20" width="10" height="5" rx="1.5" transform="rotate(35 39 22)" fill="#718096"/>
  <!-- Bomb Sphere -->
  <circle cx="30" cy="38" r="22" fill="url(#bombBody)" filter="url(#bombShadow)"/>
  <!-- Highlight Crescent -->
  <ellipse cx="23" cy="28" rx="8" ry="5" transform="rotate(-30 23 28)" fill="#ffffff" opacity="0.35"/>
</svg>
