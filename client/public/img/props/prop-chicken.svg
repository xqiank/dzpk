<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chickenYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="combRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <filter id="chickenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Tail Feathers -->
  <path d="M12 30 C6 24 8 16 16 24 C10 18 14 12 20 22" stroke="#f57f17" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Feet -->
  <path d="M26 50 L24 58 M24 58 L20 60 M24 58 L24 61 M24 58 L28 60" stroke="#e65100" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M36 50 L38 58 M38 58 L34 60 M38 58 L38 61 M38 58 L42 60" stroke="#e65100" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Chicken Body -->
  <ellipse cx="30" cy="38" rx="16" ry="14" fill="url(#chickenYellow)" filter="url(#chickenShadow)"/>
  <!-- Wings -->
  <path d="M20 36 C16 38 18 46 26 44 C26 38 22 36 20 36 Z" fill="#f9a825"/>
  <!-- Neck and Head -->
  <path d="M36 34 C38 24 40 18 44 14 C48 18 48 26 44 32 Z" fill="url(#chickenYellow)"/>
  <!-- Red Comb on Head -->
  <path d="M42 12 C40 8 44 4 46 8 C48 4 52 6 50 11 C52 10 54 13 51 15 Z" fill="url(#combRed)"/>
  <!-- Big Bug Eyes -->
  <circle cx="46" cy="18" r="4.5" fill="#ffffff" filter="url(#chickenShadow)"/>
  <circle cx="47" cy="18" r="2.2" fill="#000000"/>
  <circle cx="48" cy="17" r="0.8" fill="#ffffff"/>
  <!-- Wide Open Screaming Beak -->
  <path d="M50 18 C58 17 62 20 54 23 C60 25 56 29 48 26 Z" fill="#ff6f00"/>
  <ellipse cx="53" cy="22" rx="3.5" ry="2.2" fill="#d50000"/>
  <!-- Red Wattle underneath Beak -->
  <ellipse cx="48" cy="28" rx="2.5" ry="4" fill="url(#combRed)"/>
</svg>
