<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gunMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="50%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <linearGradient id="goldAmmo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="gunShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Tripod Legs -->
  <g stroke="#263238" stroke-width="3" stroke-linecap="round" filter="url(#gunShadow)">
    <line x1="32" y1="36" x2="14" y2="56"/>
    <line x1="32" y1="36" x2="32" y2="58"/>
    <line x1="32" y1="36" x2="50" y2="56"/>
  </g>
  <!-- Tripod Mount / Pivot -->
  <circle cx="32" cy="35" r="4" fill="#455a64"/>
  <!-- Ammo Belt Box -->
  <rect x="20" y="32" width="10" height="9" rx="1.5" fill="#4e342e"/>
  <path d="M22 34 L28 34 M22 37 L28 37" stroke="url(#goldAmmo)" stroke-width="1.8"/>
  <!-- Gun Body / Receiver -->
  <rect x="24" y="24" width="22" height="11" rx="2" fill="url(#gunMetal)" filter="url(#gunShadow)"/>
  <!-- Rear Handle -->
  <path d="M46 25 L52 28 L52 33 L46 33" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gatling Barrels -->
  <rect x="6" y="25" width="18" height="3" rx="1" fill="url(#gunMetal)"/>
  <rect x="6" y="28" width="18" height="3" rx="1" fill="url(#gunMetal)"/>
  <rect x="6" y="31" width="18" height="3" rx="1" fill="url(#gunMetal)"/>
  <!-- Barrel Clamp Rings -->
  <rect x="18" y="24" width="3" height="11" rx="1" fill="#37474f"/>
  <rect x="8" y="24" width="3" height="11" rx="1" fill="#263238"/>
  <!-- Muzzle Flash Sparks -->
  <polygon points="5,29 1,26 3,29 0,31 4,31 2,34" fill="#ffab00"/>
</svg>
